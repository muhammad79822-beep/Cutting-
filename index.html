<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تقطيع الواح المسطحات</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1c1f24;--mut:#6b7280;--br:#d9dce1;--pri:#0b6e4f;--prt:#fff;--sheet:#f1e3c6;--line:#7a5c2e;--waste:#e9ecef;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1e2226;--tx:#eceff2;--mut:#9aa3ad;--br:#343a40;--pri:#2fb386;--prt:#06241a;--sheet:#3a3224;--line:#c9a566;--waste:#2a2f34;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;padding:12px;max-width:720px;margin-inline:auto}
h1{font-size:20px;margin:6px 0 12px;text-align:center}
.card{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:12px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 8px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:2px}
input,select{width:100%;padding:9px;border:1px solid var(--br);border-radius:8px;background:var(--bg);color:var(--tx);font-size:16px}
.row{display:grid;grid-template-columns:1.3fr 1fr 1fr .8fr 34px;gap:6px;margin-bottom:6px;align-items:center}
.row.h{font-size:12px;color:var(--mut)}
.x{border:0;background:none;color:#d33;font-size:20px}
button.b{width:100%;padding:12px;border:0;border-radius:10px;font-size:16px;font-weight:600;background:var(--pri);color:var(--prt);margin-top:6px}
button.s{background:var(--bg);color:var(--tx);border:1px solid var(--br)}
.chk{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:14px}
.chk input{width:auto}
.sum{display:flex;gap:8px;flex-wrap:wrap;font-size:14px}
.sum span{background:var(--bg);border-radius:8px;padding:6px 10px}
svg{width:100%;height:auto;display:block;border:1px solid var(--br);border-radius:6px}
.err{color:#d33;font-size:14px}
@media print{:root:not([data-theme="light"]){--bg:#fff;--card:#fff;--tx:#000;--mut:#444;--br:#bbb;--waste:#e9ecef;--line:#555;color-scheme:light}body{background:#fff;color:#000;padding:0}body>.card,.np{display:none!important}#out .card{break-inside:avoid;page-break-inside:avoid;border:0}}
</style>
</head>
<body>
<h1>✂️ تقطيع الواح المسطحات</h1>

<div class="card">
<h2>اللوح الخام</h2>
<div class="g">
<div><label>العرض</label><input id="sw" type="number" inputmode="decimal" value="244"></div>
<div><label>الطول</label><input id="sh" type="number" inputmode="decimal" value="122"></div>
<div><label>سمك الشفرة (القطع)</label><input id="kf" type="number" inputmode="decimal" value="0.3" step="0.1"></div>
<div><label>الوحدة</label><select id="un"><option>سم</option><option>مم</option></select></div>
</div>
<div class="chk"><input id="rot" type="checkbox" checked><label style="margin:0;font-size:14px;color:var(--tx)">السماح بتدوير القطع</label></div>
</div>

<div class="card">
<h2>القطع المطلوبة</h2>
<div class="row h"><div>الاسم</div><div>العرض</div><div>الطول</div><div>العدد</div><div></div></div>
<div id="rows"></div>
<button class="b s" id="add">+ إضافة قطعة</button>
<button class="b" id="go">احسب التقطيع</button>
</div>

<div id="out"></div>

<script>
const $=id=>document.getElementById(id);
let P=[{n:"أ",w:60,h:40,q:4},{n:"ب",w:80,h:50,q:3},{n:"ج",w:30,h:30,q:6}];
try{const s=localStorage.getItem("cut1");if(s){const o=JSON.parse(s);if(o&&o.P)P=o.P}}catch(e){}
function save(){try{localStorage.setItem("cut1",JSON.stringify({P}))}catch(e){}}
function draw(){
 $("rows").innerHTML="";
 P.forEach((p,i)=>{
  const r=document.createElement("div");r.className="row";
  r.innerHTML=`<input value="${p.n}" data-k="n"><input type="number" inputmode="decimal" value="${p.w}" data-k="w"><input type="number" inputmode="decimal" value="${p.h}" data-k="h"><input type="number" inputmode="numeric" value="${p.q}" data-k="q"><button class="x">×</button>`;
  r.querySelectorAll("input").forEach(el=>el.oninput=()=>{const k=el.dataset.k;P[i][k]=k==="n"?el.value:+el.value;save()});
  r.querySelector(".x").onclick=()=>{P.splice(i,1);save();draw()};
  $("rows").appendChild(r);
 });
}
$("add").onclick=()=>{P.push({n:String.fromCharCode(0x623+P.length%20),w:50,h:50,q:1});save();draw()};

function pack(W,H,k,rot,list){
 const sheets=[];const bad=[];
 list.sort((a,b)=>Math.max(b.w,b.h)-Math.max(a.w,a.h));
 for(const p of list){
  const ors=[[p.w,p.h]];if(rot&&p.w!==p.h)ors.push([p.h,p.w]);
  if(!ors.some(o=>o[0]<=W&&o[1]<=H)){bad.push(p);continue}
  let best=null;
  sheets.forEach((s,si)=>s.shelves.forEach((sf,fi)=>{
   for(const [w,h] of ors){
    if(h<=sf.h&&sf.x+w<=W){const left=W-sf.x-w;if(!best||left<best.left)best={si,fi,w,h,left}}
   }
  }));
  if(best){const sf=sheets[best.si].shelves[best.fi];
   sheets[best.si].items.push({x:sf.x,y:sf.y,w:best.w,h:best.h,p});sf.x+=best.w+k;continue}
  let done=false;
  for(const s of sheets){
   const y=s.y;let o=ors.filter(o=>o[0]<=W&&y+o[1]<=H).sort((a,b)=>a[1]-b[1])[0];
   if(o){s.shelves.push({y,h:o[1],x:o[0]+k});s.items.push({x:0,y,w:o[0],h:o[1],p});s.y+=o[1]+k;done=true;break}
  }
  if(done)continue;
  const o=ors.filter(o=>o[0]<=W&&o[1]<=H).sort((a,b)=>a[1]-b[1])[0];
  sheets.push({y:o[1]+k,shelves:[{y:0,h:o[1],x:o[0]+k}],items:[{x:0,y:0,w:o[0],h:o[1],p}]});
 }
 return{sheets,bad};
}

$("go").onclick=()=>{
 const W=+$("sw").value,H=+$("sh").value,k=+$("kf").value||0,u=$("un").value;
 const out=$("out");
 if(!(W>0&&H>0)){out.innerHTML='<div class="card err">أدخل أبعاد اللوح بشكل صحيح</div>';return}
 const list=[];
 P.forEach((p,i)=>{for(let j=0;j<(p.q|0);j++)if(p.w>0&&p.h>0)list.push({n:p.n||"#"+(i+1),w:p.w,h:p.h,c:i})});
 if(!list.length){out.innerHTML='<div class="card err">أضف قطعة واحدة على الأقل</div>';return}
 const r=pack(W,H,k,$("rot").checked,list);
 window.LR={r,u};
 let html="";
 if(r.bad.length)html+=`<div class="card err">قطع أكبر من اللوح ولم تُحسب: ${[...new Set(r.bad.map(b=>b.n+" ("+b.w+"×"+b.h+")"))].join("، ")}</div>`;
 const tot=r.sheets.length*W*H;
 const used=r.sheets.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.w*i.h,0),0);
 const wp=tot?((1-used/tot)*100).toFixed(1):0;
 html+=`<div class="card"><h2>النتيجة</h2><div class="sum"><span>عدد الألواح: <b>${r.sheets.length}</b></span><span>الهالك: <b>${wp}%</b></span><span>القطع: <b>${list.length-r.bad.length}</b></span></div><button class="b np" onclick="saveImg()">🖼️ حفظ كصورة</button></div>`;
 r.sheets.forEach((s,i)=>{
  const fs=Math.max(Math.min(W,H)/18,1);
  let svg=`<svg viewBox="-2 -2 ${W+4} ${H+4}" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="h${i}" width="${fs*0.7}" height="${fs*0.7}" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="${fs*0.7}" height="${fs*0.7}" fill="var(--waste)"/><line x1="0" y1="0" x2="0" y2="${fs*0.7}" stroke="#888" stroke-width="${fs/14}"/></pattern></defs><rect x="0" y="0" width="${W}" height="${H}" fill="url(#h${i})" stroke="var(--line)" stroke-width="${fs/8}"/>`;
  s.items.forEach(it=>{
   const f=Math.min(fs,it.w/5,it.h/3.2);
   svg+=`<rect x="${it.x}" y="${it.y}" width="${it.w}" height="${it.h}" fill="#fff" stroke="#000" stroke-width="${fs/9}"/><text x="${it.x+it.w/2}" y="${it.y+it.h/2-f*0.6}" font-size="${f*1.3}" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000">${it.p.n}</text><text x="${it.x+it.w/2}" y="${it.y+it.h/2+f*0.8}" font-size="${f*1.1}" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000">${it.w}×${it.h}</text>`;
  });
  svg+="</svg>";
  const su=s.items.reduce((b,i)=>b+i.w*i.h,0);
  html+=`<div class="card"><h2>لوح ${i+1} — هالك ${((1-su/(W*H))*100).toFixed(1)}% (${u})</h2>${svg}</div>`;
 });
 out.innerHTML=html;out.scrollIntoView({behavior:"smooth"});
};
async function savePDF(){
 try{
  const cards=[...document.querySelectorAll("#out svg")].map(s=>s.closest(".card"));
  if(!cards.length)return;
  $("pdfbox").innerHTML='<p>جاري إنشاء الملف...</p>';
  const J=[];
  for(const c of cards){
   const svg=c.querySelector("svg").cloneNode(true);
   const vb=svg.getAttribute("viewBox").split(" ").map(Number);
   const cw=1600,ch=Math.round(cw*vb[3]/vb[2]);
   svg.setAttribute("width",cw);svg.setAttribute("height",ch);
   const x=new XMLSerializer().serializeToString(svg).replace(/var\(--waste\)/g,"#e9ecef").replace(/var\(--line\)/g,"#555");
   const img=new Image();
   await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(x)});
   const cv=document.createElement("canvas");cv.width=cw;cv.height=ch+110;
   const g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,cv.width,cv.height);
   g.fillStyle="#000";g.font="bold 44px Arial,Tahoma,sans-serif";g.textAlign="center";
   g.fillText(c.querySelector("h2").textContent,cw/2,70);
   g.drawImage(img,0,110,cw,ch);
   J.push({d:atob(cv.toDataURL("image/jpeg",0.92).split(",")[1]),w:cv.width,h:cv.height});
  }
  let pdf="%PDF-1.4\n";const offs=[];
  const add=s=>{offs.push(pdf.length);pdf+=s};
  add("1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n");
  add(`2 0 obj<</Type/Pages/Kids[${J.map((_,i)=>(3+i*3)+" 0 R").join(" ")}]/Count ${J.length}>>endobj\n`);
  J.forEach((j,i)=>{
   const b=3+i*3;let w=555,h=w*j.h/j.w;if(h>802){h=802;w=h*j.w/j.h}
   const s=`q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${((595-w)/2).toFixed(2)} ${(822-h).toFixed(2)} cm /I Do Q`;
   add(`${b} 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</XObject<</I ${b+2} 0 R>>>>/Contents ${b+1} 0 R>>endobj\n`);
   add(`${b+1} 0 obj<</Length ${s.length}>>stream\n${s}\nendstream endobj\n`);
   add(`${b+2} 0 obj<</Type/XObject/Subtype/Image/Width ${j.w}/Height ${j.h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${j.d.length}>>stream\n`+j.d+"\nendstream endobj\n");
  });
  const xr=pdf.length;
  pdf+=`xref\n0 ${offs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("")+`trailer<</Size ${offs.length+1}/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`;
  const f=new File([Uint8Array.from(pdf,c=>c.charCodeAt(0))],"cutting.pdf",{type:"application/pdf"});
  const url=URL.createObjectURL(f);
  const lk='display:block;text-align:center;text-decoration:none;padding:12px;border-radius:10px;font-weight:600;margin-top:6px;';
  $("pdfbox").innerHTML=`<p>✅ الملف جاهز</p><a href="${url}" target="_blank" download="cutting.pdf" style="${lk}background:var(--pri);color:var(--prt)">فتح / تحميل الملف</a>`+((navigator.canShare&&navigator.canShare({files:[f]}))?`<button class="b s" id="shr">مشاركة الملف</button>`:"");
  const sb=$("shr");if(sb)sb.onclick=async()=>{try{await navigator.share({files:[f]})}catch(e){}};
 }catch(e){alert("تعذر إنشاء PDF: "+e.message)}
}

function ov(html){
 let o=$("ov");if(!o){o=document.createElement("div");o.id="ov";o.className="np";
  o.style.cssText="position:fixed;inset:0;z-index:99;background:var(--bg);overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));max-width:720px;margin-inline:auto";
  document.body.appendChild(o)}
 o.innerHTML='<button class="b s" onclick="document.getElementById(\'ov\').remove()">✕ إغلاق</button>'+html;
 o.scrollTop=0;
}
async function saveImg(){
 ov("<p>جاري تجهيز الصور...</p>");
 try{
  const cards=[...document.querySelectorAll("#out svg")].map(s=>s.closest(".card"));
  let h='<p>اضغط مطولًا على أي صورة ثم اختر <b>حفظ الصورة</b> (أو خد سكرين شوت).</p>';
  for(const c of cards){
   const svg=c.querySelector("svg").cloneNode(true);
   const vb=svg.getAttribute("viewBox").split(" ").map(Number);
   const cw=1600,ch=Math.round(cw*vb[3]/vb[2]);
   svg.setAttribute("width",cw);svg.setAttribute("height",ch);
   const x=new XMLSerializer().serializeToString(svg).replace(/var\(--waste\)/g,"#e9ecef").replace(/var\(--line\)/g,"#555");
   const img=new Image();
   await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(x)});
   const cv=document.createElement("canvas");cv.width=cw;cv.height=ch+110;
   const g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,cv.width,cv.height);
   g.fillStyle="#000";g.font="bold 44px Arial,Tahoma,sans-serif";g.textAlign="center";
   const t=c.querySelector("h2").textContent;
   g.fillText(t,cw/2,70);g.drawImage(img,0,110,cw,ch);
   const url=cv.toDataURL("image/png");
   h+=`<div class="card"><img src="${url}" style="width:100%;display:block" alt="${t}"><a href="${url}" download="cutting.png" style="display:block;text-align:center;padding:10px;color:var(--pri)">تحميل الصورة</a></div>`;
  }
  ov(h);
 }catch(e){ov("<p class='err'>تعذر إنشاء الصور: "+e.message+"</p>")}
}
function showTxt(){
 if(!window.LR)return;
 const {r,u}=window.LR;let t="";
 r.sheets.forEach((s,i)=>{
  t+=`لوح ${i+1} (${u})\n`;
  [...s.items].sort((a,b)=>a.y-b.y||a.x-b.x).forEach(it=>{
   t+=`- ${it.p.n}: ${it.w}×${it.h} | من اليسار ${+it.x.toFixed(2)} ومن الأعلى ${+it.y.toFixed(2)}\n`;
  });
  t+="\n";
 });
 if(r.bad.length)t+="قطع لم تدخل: "+r.bad.map(b=>b.n).join("، ")+"\n";
 ov('<textarea id="tx" readonly style="width:100%;height:55vh;font-size:15px;direction:rtl"></textarea><button class="b" id="cp">نسخ النص</button>');
 const ta=$("tx");ta.value=t;
 $("cp").onclick=async()=>{try{await navigator.clipboard.writeText(t)}catch(e){ta.select();try{document.execCommand("copy")}catch(_){}}$("cp").textContent="تم النسخ ✅"};
}
draw();
</script>
</body>
</html>
